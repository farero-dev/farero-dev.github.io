# Tag v* → Universal build → GitHub Release (Q45).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: daemon/go.sum
      - name: Test daemon
        working-directory: daemon
        run: |
          go vet ./...
          go test -race ./...
      - name: Character tests
        run: swift test --package-path app/LighthouseKit
      - name: App tests
        run: swift test --package-path app
      - name: Build Farero.app
        env:
          FARERO_GITHUB_CLIENT_ID: ${{ vars.FARERO_GITHUB_CLIENT_ID }}
          JOBS: "4"
        run: scripts/build.sh "${GITHUB_REF_NAME#v}"
      - name: Checksum
        working-directory: build
        run: shasum -a 256 "Farero-${GITHUB_REF_NAME#v}.zip" > "Farero-${GITHUB_REF_NAME#v}.zip.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          beta_note=""
          # A tag with a hyphen (v0.1.0-beta.1) is a prerelease.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
            beta_note="> This is a beta. Expect rough edges, and please report problems as issues."
          fi
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{BETA_NOTE}}/$beta_note/" \
            .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            "build/Farero-$version.zip" "build/Farero-$version.zip.sha256" \
            --verify-tag --title "farero $version" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${flags[@]}"
