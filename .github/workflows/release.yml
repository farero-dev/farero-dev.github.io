# Tag v* → Universal build → GitHub Release (Q45).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: daemon/go.sum
      - name: Test daemon
        working-directory: daemon
        run: go test ./...
      - name: Test app
        run: swift test --package-path app
      - name: Build Farero.app
        env:
          FARERO_GITHUB_CLIENT_ID: ${{ vars.FARERO_GITHUB_CLIENT_ID }}
          JOBS: "4"
        run: scripts/build.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/Farero-$version.zip" \
            --title "farero $version" --generate-notes
